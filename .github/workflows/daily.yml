name: Daily News Push

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore push cache
        uses: actions/cache/restore@v4
        with:
          path: pushed.json
          key: pushed-news-${{ github.run_number }}
          restore-keys: |
            pushed-news-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          PUSHED_CACHE_FILE: pushed.json
        run: python main.py

      - name: Save push cache
        uses: actions/cache/save@v4
        with:
          path: pushed.json
          key: pushed-news-${{ github.run_number }}
