name: Campus Scheduler Checks

on:
  push:
    paths:
      - 'campus_scheduler/**'
      - '.github/workflows/campus-reminders.yml'
      - '.github/workflows/campus-scheduler-checks.yml'
  pull_request:
    paths:
      - 'campus_scheduler/**'
      - '.github/workflows/campus-reminders.yml'
      - '.github/workflows/campus-scheduler-checks.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s campus_scheduler -p 'test_*.py' -v
